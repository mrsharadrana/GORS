name: GORS Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f GORS_APP_PROD/requirements.txt ]; then
            python -m pip install -r GORS_APP_PROD/requirements.txt
          else
            python -m pip install numpy pandas yfinance pytest
          fi
          python -m pip install pytest

      - name: Verify authoritative frozen source
        run: |
          test -f gors_final_fixed.py
          test -f GORS_APP_PROD/gors_engine.py
          python - <<'PY'
          import ast
          from pathlib import Path
          ast.parse(Path('gors_final_fixed.py').read_text())
          ast.parse(Path('GORS_APP_PROD/gors_engine.py').read_text())
          print('Frozen source and production engine: present and syntactically valid')
          PY

      - name: Run unit tests
        run: python -m pytest -q

      - name: Broker execution safety check
        run: |
          if grep -RniE 'KiteConnect|place_order|modify_order|cancel_order|order_place' GORS_APP_PROD tests --exclude-dir=__pycache__; then
            echo 'Broker order execution references detected.'
            exit 1
          fi
          echo 'Broker execution safety check: PASS'

      - name: Live Yahoo smoke test
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('GORS_APP_PROD').resolve()))
          import yfinance as yf
          import pandas as pd

          symbols = ['MON100.NS', 'NIFTYBEES.NS', 'GOLDBEES.NS']
          frames = []
          for symbol in symbols:
              df = yf.download(symbol, period='10d', interval='1d', auto_adjust=False, progress=False)
              if df is None or df.empty:
                  raise SystemExit(f'No Yahoo data returned for {symbol}')
              frames.append(df)

          common = set(frames[0].index)
          for df in frames[1:]:
              common &= set(df.index)
          if not common:
              raise SystemExit('No common Yahoo market date found')
          latest = max(pd.Timestamp(x).normalize() for x in common)
          print(f'Yahoo live smoke test latest common date: {latest.date()}')
          print('Live Yahoo smoke test: PASS')
          PY

      - name: Frozen engine safety import
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('GORS_APP_PROD').resolve()))
          import gors_engine
          print('Production engine imported successfully')
          print('Frozen configuration:', {k: getattr(gors_engine, k) for k in dir(gors_engine) if k in {'HOLD_RANK','TOP_N','RSI_PERIOD','RSI_HIGH','RSI_LOW','DD_TRIGGER','RECOVERY','RISK_OFF_EXPOSURE','TRANSACTION_COST'}})
          PY

      - name: Validation summary
        run: |
          echo '========================================'
          echo 'GORS ONLINE VALIDATION COMPLETE'
          echo 'Unit tests: PASS'
          echo 'Frozen source present: PASS'
          echo 'Production engine import: PASS'
          echo 'Broker execution safety: PASS'
          echo 'Yahoo live smoke test: PASS'
          echo '========================================'
          echo 'Note: exact historical HR5 metric parity is not asserted against live Yahoo data.'
          echo 'Deterministic parity requires a pinned historical data fixture.'
