name: One-off PostgreSQL percent fix

on:
  push:
    branches:
      - fix/postgres-percent-placeholder

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: fix/postgres-percent-placeholder
          fetch-depth: 0

      - name: Apply targeted fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("GORS_APP_PROD/gors_db.py")
          text = path.read_text()
          old = 'return sql.replace("?", "%s")'
          new = '''return sql.replace("%", "%%").replace("?", "%s")'''
          if old not in text:
              raise SystemExit("Expected PostgreSQL SQL adapter line was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          python -m py_compile GORS_APP_PROD/gors_db.py
          grep -n -A4 -B3 'def _sql' GORS_APP_PROD/gors_db.py

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GORS_APP_PROD/gors_db.py
          git rm .github/workflows/fix-postgres-percent.yml
          git commit -m "fix: escape percent literals for psycopg"
          git push origin HEAD:fix/postgres-percent-placeholder
