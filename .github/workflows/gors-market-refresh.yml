name: GORS Market Refresh

on:
  schedule:
    # 4:00 PM Monday-Friday in India.
    - cron: '0 16 * * 1-5'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GORS_APP_PROD
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh Yahoo Finance data and persist GORS signal
        run: python market_refresh.py
