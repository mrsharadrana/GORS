name: Phase 8 readable timestamp patch

on:
  push:
    branches: [fix/phase8-readable-timestamp]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format dashboard timestamp
        run: |
          python -c 'from pathlib import Path; p=Path("GORS_APP_PROD/app.py"); t=p.read_text(encoding="utf-8"); old="{snapshot[\\"snapshot_time\\"] if snapshot else \\"No verified snapshot\\"}"; new="{pd.to_datetime(snapshot[\\"snapshot_time\\"], utc=True).tz_convert(\\"Asia/Kolkata\\").strftime(\\"%d-%b-%Y %I:%M %p IST\\") if snapshot else \\"No verified snapshot\\"}"; assert old in t; p.write_text(t.replace(old,new,1),encoding="utf-8")'
      - name: Add timestamp regression assertion
        run: |
          python -c 'from pathlib import Path; p=Path("tests/test_phase8_production_smoke.py"); t=p.read_text(encoding="utf-8") if p.exists() else ""; extra="\n\ndef test_timestamp_is_human_readable_ist():\n    text = PAGE.read_text(encoding=\"utf-8\")\n    assert \"Asia/Kolkata\" in text\n    assert \"%d-%b-%Y %I:%M %p IST\" in text\n"; p.write_text(t+extra,encoding="utf-8") if "test_timestamp_is_human_readable_ist" not in t else None'
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GORS_APP_PROD/app.py tests/test_phase8_production_smoke.py
          git commit -m 'Fix human-readable dashboard timestamp'
          git push
