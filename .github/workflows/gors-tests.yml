name: GORS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/implement-frozen-hr5-manual-trading-dashboard
      - fix/persistent-neon-db

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r GORS_APP_PROD/requirements.txt
          python -m pip install pytest
      - name: Verify dependency pins
        run: python tests/test_dependency_pins.py
      - name: Secret scan
        run: python scripts/secret_scan.py
      - name: Compile production Python
        run: python -m py_compile GORS_APP_PROD/gors_db.py GORS_APP_PROD/pages/Rotation_Signal.py GORS_APP_PROD/pages/History.py GORS_APP_PROD/rotation_history.py
      - name: Run GORS tests
        run: python -m pytest tests/test_gors_engine.py tests/test_phase7_dashboard.py tests/test_etf_rotation_history.py tests/test_rotation_history_page.py tests/test_actions_hardening.py tests/test_dependency_pins.py -q
