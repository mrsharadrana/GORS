name: GORS Tests

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/implement-frozen-hr5-manual-trading-dashboard

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy pandas yfinance
      - name: Run GORS tests
        run: python -m pytest tests/test_gors_engine.py -q
