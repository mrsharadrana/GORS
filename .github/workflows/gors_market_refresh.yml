name: GORS Market Data Refresh

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r GORS_APP_PROD/requirements.txt
      - name: Refresh and validate Yahoo data
        working-directory: GORS_APP_PROD
        run: python refresh_market_data.py
      - name: Commit validated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GORS_APP_PROD/data/market_data.csv GORS_APP_PROD/data/market_data_meta.json
          git diff --cached --quiet || git commit -m "chore: refresh validated market data"
          git push
