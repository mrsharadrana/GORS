name: One-off market refresh source fix

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Apply targeted fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("GORS_APP_PROD/gors_db.py")
          text = path.read_text()
          old = 'top3=excluded.top3,note=excluded.note,created_at=excluded.created_at"""'
          new = '''top3=excluded.top3,note=excluded.note,created_at=CASE
                WHEN excluded.note LIKE 'Automated Yahoo Finance refresh%' THEN excluded.created_at
                ELSE decision_history.created_at END"""'''
          if old not in text:
              raise SystemExit("Expected save_decision SQL pattern was not found")
          path.write_text(text.replace(old, new, 1))
          PY

          python -m py_compile GORS_APP_PROD/gors_db.py
          grep -n -A5 -B5 "Automated Yahoo Finance refresh%" GORS_APP_PROD/gors_db.py

      - name: Commit fix and remove one-off files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GORS_APP_PROD/gors_db.py
          git rm .github/workflows/oneoff-fix-market-refresh-source.yml ONEOFF_TRIGGER.txt
          git commit -m "fix: preserve automated market refresh timestamp"
          git push origin HEAD:fix/market-refresh-source-v2
